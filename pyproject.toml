[project]
name = "postulo"
version = "0.1.0"
description = "Open source, local-first assistant for internship, apprenticeship and job search in France."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hanine Attia" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "pypdfium2>=5.15.2",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "anthropic>=2.7.0",
    "keyring>=25.7.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
postulo = "postulo.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/postulo"]

[tool.hatch.build.targets.sdist]
include = ["backend/postulo", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests", "scripts"]
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
# ASYNC109: SPEC 5.1 mandates a `timeout` argument on provider methods.
ignore = ["S101", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/postulo", "tests", "scripts"]
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-ra -m 'not network'"
markers = ["network: real network calls, disabled by default (run with -m network)"]
filterwarnings = ["error::DeprecationWarning:postulo.*"]

[tool.uv]
link-mode = "copy"
