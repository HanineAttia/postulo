# Command-line use only (the app migrates itself at startup).
# Example: uv run alembic -c backend/postulo/db/alembic.ini revision --autogenerate -m "add offer"
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
# sqlalchemy.url is resolved from the user data directory (POSTULO_HOME) in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
